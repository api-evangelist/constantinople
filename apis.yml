aid: constantinople
name: Constantinople
description: >-
  Constantinople is a Sydney-based fintech providing an AI-native core-banking
  platform that lets banks run product, technology, data, operations, and
  compliance as a single modern fabric. It powers retail, business, and
  embedded banking across accounts, payments, cards, lending, mortgages, and
  term deposits, with headless APIs and SDKs, digital onboarding, an AI
  concierge for customers, and the "Justinian" AI workbench for bankers. Risk
  and compliance (fraud, financial-crime detection, regulatory reporting) are
  built into the platform, which is SOC 2 Type II and ISO 27001 certified.
  Constantinople is backed by Prosus Ventures (Series A, A$50M). The
  developer/API surface is a gated B2B platform; enrichment here is sourced from
  the company's public web presence.
